version: 2.1

jobs:
  round1_preview-v1:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: swing out
          command: |
            mkdir -p /tmp/data
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/data/checkpoint-B.pickle; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/data/checkpoint-B.pickle; done; true
            len=$(wc -c </tmp/data/checkpoint-B.pickle); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - checkpoint-B.pickle
  preview-v1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Read staged data
          command: |
            grep -c . /tmp/data/checkpoint-B.pickle || true
      - run:
          name: Checkout code
          command: git clone --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat release.tar | tar xf -
      - run:
          no_output_timeout: 97m
          command: /bin/bash -c "./perform"
  g2_fix-queue-redirect:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
