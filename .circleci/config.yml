          command: |
            mkdir -p /tmp/data
            { set +o pipefail 2>/dev/null; echo $(( $(date +%s) % 10000 )) | md5sum; true ; } > /tmp/data/pt-alt.pickle
            len=$(wc -c </tmp/data/pt-alt.pickle); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - pt-alt.pickle
